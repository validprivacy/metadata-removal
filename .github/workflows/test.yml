name: Tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Offline build is up to date
        run: |
          node build.mjs
          git diff --exit-code metadata-removal-offline.html
      - name: Tests
        run: npm test
